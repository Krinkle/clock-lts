name: "PHPUnit tests"

on:
  pull_request:
  push:

jobs:
  phpunit:
    name: "PHP ${{ matrix.php-version }}"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '7.4'
          - php-version: '8.0'
          - php-version: '8.1'
          - php-version: '8.2'
          - php-version: '8.3'
          - php-version: '8.4'

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@2.26.0"
        with:
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: composer:v2"

      - name: "Install dependencies"
        run: composer install --no-interaction --no-progress

      - run: composer test

  phpunit-legacy:
    name: "PHPUnit legacy (PHP ${{ matrix.php-version }})"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '7.2'

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@2.26.0"
        with:
          php-version: "${{ matrix.php-version }}"
          ini-values: memory_limit=-1
          tools: composer:v2"

      - name: "Install dependencies"
        run: |
          composer remove --dev lcobucci/coding-standard --no-update
          composer remove --dev phpunit/phpunit --no-update
          composer require --dev 'phpunit/phpunit 8.5'

      - run: vendor/bin/phpunit
